name: Supabase Keepalive

on:
  schedule:
    - cron: "0 9 */4 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -s -o /dev/null -w "Supabase responded with HTTP %{http_code}\n" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/keepalive_ping?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
